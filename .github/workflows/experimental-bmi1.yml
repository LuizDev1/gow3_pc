name: Experimental BMI1 compatibility build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legacy-cpu-avx2-compat
          submodules: recursive
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
      - name: Build runtime and test fallback
        run: |
          bash build.sh
          ninja -C out/gpu bmi1-compat-test
          out/gpu/bmi1-compat-test.exe
      - name: Collect experimental runtime and dependencies
        run: |
          mkdir -p out/bmi1-package/bin
          cp out/gow3-probe.exe out/bmi1-package/bin/
          ldd out/gow3-probe.exe | awk '/\/clang64\/bin\// {print $3}' | sort -u |
            while read -r dll; do cp -u "$dll" out/bmi1-package/bin/; done
          cp docs/CPU_COMPATIBILITY.md out/bmi1-package/
          cp LICENSE out/bmi1-package/
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-bmi1-runtime
          path: out/bmi1-package/
          if-no-files-found: error
          retention-days: 14

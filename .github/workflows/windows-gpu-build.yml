name: Windows renderer build diagnostic

on:
  workflow_dispatch:
  push:
    branches: [the-last-guardian]
    paths:
      - '.github/workflows/windows-gpu-build.yml'
      - 'gpu/**'
      - '.gitmodules'

permissions:
  contents: read

concurrency:
  group: windows-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-ffmpeg
      - name: Record dependency versions
        shell: msys2 {0}
        run: |
          set -o pipefail
          mkdir -p out/gpu-build-logs
          pacman -Q | tee out/gpu-build-logs/packages.log
          clang++ --version | tee out/gpu-build-logs/compiler.log
      - name: Configure experimental renderer
        shell: msys2 {0}
        run: |
          set -o pipefail
          cmake -S gpu -B out/gpu-windows -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBB_LTO=OFF -DBB_NET=OFF \
            2>&1 | tee out/gpu-build-logs/configure.log
      - name: Compile renderer library only
        shell: msys2 {0}
        run: |
          set -o pipefail
          cmake --build out/gpu-windows --target bbgpu --parallel 2 \
            2>&1 | tee out/gpu-build-logs/build.log
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlg-windows-renderer-build-logs
          path: out/gpu-build-logs/*.log
          if-no-files-found: warn
          retention-days: 14

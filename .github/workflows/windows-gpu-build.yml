name: Windows renderer build diagnostic

on:
  workflow_dispatch:
  push:
    branches: [the-last-guardian]
    paths:
      - '.github/workflows/windows-gpu-build.yml'
      - 'platform/windows/gow3-base/**'
      - 'gpu/shim/fsr_windows_headers.h'
      - '.gitmodules'
      - 'tools/check_windows_renderer_dependencies.py'
      - 'tools/package_renderer_probe.py'
      - 'tools/prepare_content_parameters.py'
      - 'tests/test_content_parameters.py'
      - 'tests/test_package_renderer_probe.py'
      - 'src/windows*'
      - 'tests/test_fsr_windows_headers.cpp'
      - 'tests/test_gpu_windows_host.cpp'

permissions:
  contents: read

concurrency:
  group: windows-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Windows renderer dependencies
        shell: pwsh
        run: |
          git -c core.longpaths=true submodule update --init --depth 1 -- platform/windows/gow3-base/gpu/third_party/fsr-vulkan platform/windows/gow3-base/gpu/third_party/imgui platform/windows/gow3-base/gpu/third_party/magic_enum platform/windows/gow3-base/gpu/third_party/miniz platform/windows/gow3-base/gpu/third_party/xbyak
          if ($LASTEXITCODE -ne 0) { throw 'Renderer dependency checkout failed' }
          python tools/check_windows_renderer_dependencies.py
          if ($LASTEXITCODE -ne 0) { throw 'Renderer dependency verification failed' }
          python -m unittest discover -s tests -p test_package_renderer_probe.py
          if ($LASTEXITCODE -ne 0) { throw 'Renderer package tests failed' }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-ffmpeg
      - name: Record dependency versions
        shell: msys2 {0}
        run: |
          set -o pipefail
          mkdir -p out/gpu-build-logs
          pacman -Q | tee out/gpu-build-logs/packages.log
          clang++ --version | tee out/gpu-build-logs/compiler.log
      - name: Test FidelityFX Windows CRT declarations
        shell: msys2 {0}
        run: |
          set -o pipefail
          clang++ -std=c++17 -Wall -Wextra -Werror -I. tests/test_fsr_windows_headers.cpp \
            -o out/fsr-windows-headers-test.exe 2>&1 | tee out/gpu-build-logs/fsr-headers.log
          ./out/fsr-windows-headers-test.exe
      - name: Test Windows renderer host helpers
        shell: msys2 {0}
        run: |
          set -o pipefail
          clang++ -std=c++23 -Wall -Wextra -Werror -DNOMINMAX -DWIN32_LEAN_AND_MEAN -I. \
            tests/test_gpu_windows_host.cpp -o out/gpu-windows-host-test.exe \
            2>&1 | tee out/gpu-build-logs/host-helpers.log
          ./out/gpu-windows-host-test.exe
      - name: Configure experimental renderer
        shell: msys2 {0}
        run: |
          set -o pipefail
          cmake -S platform/windows/gow3-base/gpu -B out/gpu-windows -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DGOW3_LTO=OFF \
            2>&1 | tee out/gpu-build-logs/configure.log
      - name: Link renderer with TLG Windows runtime
        shell: msys2 {0}
        run: |
          set -o pipefail
          cmake --build out/gpu-windows --target tlg-renderer-probe --parallel 2 \
            2>&1 | tee out/gpu-build-logs/build.log
      - name: Test linked runtime services without starting a GPU
        shell: msys2 {0}
        run: |
          set -o pipefail
          ./out/gpu-windows/tlg-renderer-probe.exe --selftest-renderer-link 2>&1 | tee out/gpu-build-logs/link-test.log
          ./out/gpu-windows/tlg-renderer-probe.exe --selftest-renderer-identity 2>&1 | tee out/gpu-build-logs/identity-test.log
          GOW3_UPSCALER=fsr3 GOW3_NULL_GPU=1 GOW3_READBACKS=0 ./out/gpu-windows/tlg-renderer-probe.exe --selftest-renderer-profile 2>&1 | tee out/gpu-build-logs/profile-test.log
          ./out/gpu-windows/tlg-renderer-probe.exe --selftest-memory 2>&1 | tee out/gpu-build-logs/memory-test.log
          ./out/gpu-windows/tlg-renderer-probe.exe --selftest-renderer-recovery 2>&1 | tee out/gpu-build-logs/recovery-test.log
      - name: Package renderer diagnostic and runtime dependencies
        shell: msys2 {0}
        run: |
          set -o pipefail
          python tools/package_renderer_probe.py --binary out/gpu-windows/tlg-renderer-probe.exe \
            --dll-dir "$(cygpath -w /clang64/bin)" 2>&1 | tee out/gpu-build-logs/package.log
      - name: Preserve experimental renderer diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: tlg-windows-renderer-diagnostic
          path: out/renderer-package/
          retention-days: 14
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlg-windows-renderer-build-logs
          path: out/gpu-build-logs/*.log
          if-no-files-found: warn
          retention-days: 14
